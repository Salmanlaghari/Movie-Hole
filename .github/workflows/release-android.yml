name: Release Signed APK & AAB Packaging Workflow

on:
  push:
    branches:
      - main
      - feat/movie-hole-premium
      - feat/movie-hole-premium-3283182103515465340
  workflow_dispatch:

jobs:
  build-and-sign:
    name: Build & Sign Production Mobile Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Setup Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Decode & Inject Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          KEYSTORE_FILE="release.keystore"
          ALIAS_NAME="ai-browser"
          STOREPASS="moviehole123"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "-> KEYSTORE_BASE64 secret is provided. Decoding..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "✓ Successfully decoded release keystore from secrets."
          else
            echo "-> KEYSTORE_BASE64 secret is empty. Checking local keystore file..."
          fi

          # Check if the keystore file exists
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "✓ Keystore file '$KEYSTORE_FILE' exists."

            # Check if the alias already exists using keytool -list
            if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STOREPASS" -alias "$ALIAS_NAME" > /dev/null 2>&1; then
              echo "✓ Alias '$ALIAS_NAME' already exists in '$KEYSTORE_FILE'. Reusing the existing alias."
            else
              echo "-> Alias '$ALIAS_NAME' does not exist in '$KEYSTORE_FILE'. Generating alias..."
              keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias "$ALIAS_NAME" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STOREPASS" -keypass "$STOREPASS" -dname "CN=Movie Hole, OU=Development, O=Movie Hole Corp, L=San Francisco, S=California, C=US"
            fi
          else
            echo "-> Keystore file '$KEYSTORE_FILE' does not exist. Generating a new keystore and keypair..."
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias "$ALIAS_NAME" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STOREPASS" -keypass "$STOREPASS" -dname "CN=Movie Hole, OU=Development, O=Movie Hole Corp, L=San Francisco, S=California, C=US"
          fi

      - name: Compile Web Application & Execute Release Sign Pipeline
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'moviehole123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ai-browser' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'moviehole123' }}
        run: node scripts/build-android-release.js

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Hole-Release-Signed-APK
          path: release-artifacts/movie-hole-release-signed.apk

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movie-Hole-Release-Signed-AAB
          path: release-artifacts/movie-hole-release-signed.aab
